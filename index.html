<title>KELWIN CONTROL · Acceso restringido</title>
<style>
:root{--bg:#04070a;--line:#16351f;--neon:#3dff8f;--dim:#5f7d6b;--txt:#dff5e7;--bad:#ff5f6d;
--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1000px 600px at 70% -10%,#0b2417 0%,transparent 60%),var(--bg);color:var(--txt);font-family:var(--sans);display:grid;place-items:center;padding:20px}
.box{width:min(420px,94vw);background:linear-gradient(180deg,#0d1a14,#0a1310);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 30px 90px #000c;text-align:center}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--neon),#0f8a4d);display:grid;place-items:center;font-weight:800;color:#02150b;font-size:20px;margin:0 auto 14px;box-shadow:0 0 22px #3dff8f55}
h1{font-family:var(--mono);font-size:14px;letter-spacing:.22em;color:var(--neon);margin-bottom:6px}
.sub{font-size:10.5px;letter-spacing:.16em;color:var(--dim);font-family:var(--mono);margin-bottom:20px}
input{width:100%;background:#0a1611;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 13px;font-size:13px;font-family:var(--sans);outline:none;text-align:center;letter-spacing:.12em}
input:focus{border-color:var(--neon);box-shadow:0 0 0 3px #3dff8f1a}
button{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:linear-gradient(135deg,#123a24,#0e2418);color:var(--neon);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.15s}
button:hover{background:#123a24;box-shadow:0 0 20px #3dff8f22}
#err{min-height:16px;margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--bad);letter-spacing:.06em}
.foot{margin-top:18px;font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.1em;line-height:1.6}
#frame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>

function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  if(!pw){err.textContent='Introduce la contraseña';return;}
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(PAYLOAD));
    const html=new TextDecoder().decode(pt);
    const f=document.getElementById('frame');
    f.srcdoc=html;
    document.getElementById('gate').style.display='none';
    f.style.display='block';
  }catch(e){err.textContent='Contraseña incorrecta. Inténtalo de nuevo.';}
}
document.getElementById('btn').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
